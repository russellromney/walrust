# cargo-nextest configuration for the walrust workspace.
#
# Most tests build S3 keys under a unique prefix/name per run (see
# `unique_name` in tests/production_e2e.rs and `unique_prefix` in
# crates/walrust-core/tests/snapshot_source_s3.rs) and are safe to run
# concurrently against the live Tigris bucket.
#
# A small number of tests are genuinely timing- or process-sensitive
# (SIGKILL of real child processes, deliberate checkpoint/write races,
# a watch-mode timer reset, a "two writers, one wins" race, split-brain
# equivocation, fenced-follower reconstruction, and a real chaos process
# kill). Those are pinned to the `serial` test group below (max-threads=1)
# so they never run concurrently with each other or with themselves, which
# is how they behaved under the old `--test-threads=1` execution. Everything
# else runs fully parallel.
nextest-version = { recommended = "0.9.100" }

[test-groups.serial]
max-threads = 1

[[profile.default.overrides]]
# kill: real process-kill tests --
#   tests/production_e2e.rs: e2e_cli_watch_sigkill_restart_round_trips_sqlite_rows,
#     e2e_core_replicator_sigkill_restart_round_trips_sqlite_rows,
#     e2e_core_replicator_sigkill_child (ignored spawn target);
#   walrust-dst/tests/crash_recovery.rs: chaos_crashes_survives_real_process_kill
#     (the DST chaos --faults crashes path: real SIGKILLs of child writers);
#   walrust-dst/src/disk_queue_tests.rs: test_kill_mid_upload_recovery
#     (sleep-based kill/resume coordination).
#
# racing: deliberate checkpoint-vs-flush race tests --
#   tests/production_e2e.rs: e2e_core_replicator_racing_checkpoint_reanchors_without_data_loss,
#     e2e_cli_watch_racing_checkpoint_no_data_loss.
#
# restart: replicator restart/reopen tests --
#   tests/production_e2e.rs: e2e_core_replicator_restart_reopens_state_and_restores_cleanly
#     holds read-transaction pins against an autocheckpointing writer and
#     flaked once under parallel load ("snapshot checkpoint incomplete,
#     busy=1"); the other restart-named tests are fast logic tests that are
#     cheap to serialize alongside it.
#
# timer / interval: watch-timer and interval-named tests (generous match) --
#   tests/production_e2e.rs: e2e_cli_watch_independent_snapshot_timer_round_trips_through_reset;
#   plus a few interval-named config/cursor logic tests that are cheap either way.
#
# two_watchers: "two concurrent writers, only one wins" race --
#   crates/walrust-core/tests/replicator_flush.rs: test_walrust_owned_concurrent_two_watchers_only_one_wins.
#
# second_writer_same_base_same_seq: B11 split-brain equivocation --
#   crates/walrust-core/src/sync.rs: walrust_owned_sync_rejects_second_writer_same_base_same_seq.
#
# fenced: fenced-follower reconstruction / rollover-refusal tests --
#   crates/walrust-core/tests/replicator_flush.rs:
#     test_fenced_external_mode_refuses_checkpoint_rollover_until_reanchored,
#     test_rollover_observer_fires_on_fenced_external_refusal;
#   crates/walrust-core/src/sync.rs:
#     reconstruct_fenced_follower_replays_published_deltas,
#     reconstruct_fenced_follower_rejects_forged_envelopes,
#     reconstruct_fenced_follower_rejects_midstream_forge_atomically;
#   walrust-dst/src/invariants.rs: test_prop_fenced_delta_restore.
filter = '''
test(~kill)
  | test(~racing)
  | test(~restart)
  | test(~timer)
  | test(~interval)
  | test(~two_watchers)
  | test(~second_writer_same_base_same_seq)
  | test(~fenced)
'''
test-group = 'serial'
