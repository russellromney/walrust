[package]
name = "walrust"
version = "0.3.1"
edition = "2021"
description = "SQLite WAL sync to S3-compatible storage — continuous replication, point-in-time restore"
authors = ["Russell Romney <russellromney@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/russellromney/walrust"
readme = "README.md"

[features]
default = []
# Re-enables hadb-io's `s3` (AWS SDK + the `hadb_io::s3` helpers used by
# legacy walrust-core consumers). The trait surface (StorageBackend) is
# already AWS-free; this feature only governs the convenience re-exports.
s3 = ["hadb-io/s3"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Async trait support
async-trait = "0.1"

# Storage substrate (trait). Use the published 0.4.1 release so consumers that
# also depend on hadb-storage from crates.io resolve to a single trait def.
hadb-storage = "0.4.1"

# Legacy retry/checksum helpers; replaced in step i.
# default-features off so consumers can build walrust-core with no AWS deps;
# the outer walrust crate's `s3` feature re-enables hadb-io/s3.
# Pinned to the revision compatible with the published hadb-storage 0.4.1 API.
hadb-io = { git = "https://github.com/russellromney/hadb.git", rev = "6bf02111d555b2e495fd737c2074876424b2875d", package = "hadb-io", default-features = false }

# HADBP changeset format. Pinned to the revision compatible with the published
# hadb-storage 0.4.1 API.
hadb-changeset = { git = "https://github.com/russellromney/hadb.git", rev = "6bf02111d555b2e495fd737c2074876424b2875d", package = "hadb-changeset" }

# SQLite for checkpointing (shadow WAL)
rusqlite = { version = "0.35", features = ["bundled"] }

# Concurrent async streams
futures = "0.3"

# Utilities
anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Directory traversal (shadow WAL size)
walkdir = "2"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
# Integration tests use the S3 impl directly for compile-time usability checks.
hadb-storage-s3 = "0.4.1"
