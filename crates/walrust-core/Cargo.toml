[package]
name = "walrust-core"
version = "0.3.1"
edition = "2021"
description = "SQLite WAL sync to S3-compatible storage — continuous replication, point-in-time restore"
authors = ["Russell Romney <russellromney@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/russellromney/walrust"
readme = "README.md"

[features]
default = []
# Re-enables hadb-io's `s3` (AWS SDK + the `hadb_io::s3` helpers used by
# legacy walrust-core consumers). The trait surface (StorageBackend) is
# already AWS-free; this feature only governs the convenience re-exports.
s3 = ["hadb-io/s3"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Async trait support
async-trait = "0.1"

# Storage substrate (trait)
hadb-storage = { git = "https://github.com/russellromney/hadb.git", version = "0.4.0", package = "hadb-storage", rev = "1100d3b615743405c676ecefa5743f2c277ea25f" }

# Legacy retry/checksum helpers; replaced in step i.
# default-features off so consumers can build walrust-core with no AWS deps;
# the outer walrust crate's `s3` feature re-enables hadb-io/s3.
hadb-io = { git = "https://github.com/russellromney/hadb.git", version = "0.4.0", package = "hadb-io", rev = "1100d3b615743405c676ecefa5743f2c277ea25f", default-features = false }

# HADBP changeset format
hadb-changeset = { git = "https://github.com/russellromney/hadb.git", version = "0.4.0", package = "hadb-changeset", rev = "1100d3b615743405c676ecefa5743f2c277ea25f" }

# Legacy Litestream-derived LTX format used by the root CLI migration path.
litepages = "0.1.0"

# SQLite for checkpointing (shadow WAL)
rusqlite = { version = "0.35", features = ["bundled"] }

# Concurrent async streams
futures = "0.3"

# Utilities
anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

# Directory traversal (shadow WAL size)
walkdir = "2"

# Phase 004 canonical-CBOR delta envelope (TLM_DELTA). Same encoder +
# hash primitive as turbolite's TLM1 manifest envelope so the chain
# verifier on the follower side speaks one language across both
# layers. See `external_delta.rs` for the wire format.
ciborium = "0.2"
blake3 = "1"
serde_bytes = "0.11"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
# Integration tests use the S3 impl directly for compile-time usability checks.
hadb-storage-s3 = { git = "https://github.com/russellromney/hadb.git", version = "0.4.0", package = "hadb-storage-s3", rev = "1100d3b615743405c676ecefa5743f2c277ea25f" }
