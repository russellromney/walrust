[package]
name = "walrust"
version = "0.3.0"
edition = "2021"
description = "Lightweight SQLite WAL sync to S3/Tigris"
authors = ["Russell Romney <russellromney@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/russellromney/walrust"
homepage = "https://github.com/russellromney/walrust"
keywords = ["sqlite", "wal", "s3", "backup", "sync"]
categories = ["database", "command-line-utilities"]

[lib]
name = "walrust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "walrust"
path = "src/main.rs"

[features]
default = []
python = ["pyo3"]

[dependencies]
# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Parallelization for LTX encoding (CPU-bound compression)
rayon = "1.10"

# S3
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-smithy-runtime = { version = "1", features = ["client"] }

# File watching
notify = "6"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async trait support
async-trait = "0.1"

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
glob = "0.3"
sha2 = "0.10"
rand = "0.8"

# Webhooks
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
hex = "0.4"

# LTX format (Litestream-compatible)
litetx = "0.1"

# SQLite for checkpointing
rusqlite = { version = "0.32", features = ["bundled"] }

# Directory traversal (for shadow WAL size calculation)
walkdir = "2"

# Dashboard + metrics
axum = "0.7"
prometheus = "0.13"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
brunch = "0.5"
tempfile = "3"
tower = "0.5"

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
