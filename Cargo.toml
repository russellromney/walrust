[package]
name = "walrust"
version = "0.5.1"
edition = "2021"
description = "Lightweight SQLite WAL sync to S3/Tigris"
authors = ["Russell Romney <russellromney@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/russellromney/walrust"
homepage = "https://github.com/russellromney/walrust"
keywords = ["sqlite", "wal", "s3", "backup", "sync"]
categories = ["database", "command-line-utilities"]
exclude = [
    "crates/*/target/",
    "bench/",
    "experiments/",
    ".github/",
]

[lib]
name = "walrust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "walrust"
path = "src/main.rs"

[features]
default = []
python = ["pyo3"]

[dependencies]
# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Parallelization for LTX encoding (CPU-bound compression)
rayon = "1.10"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async trait support
async-trait = "0.1"

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
glob = "0.3"
sha2 = "0.10"

# Webhooks
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
hex = "0.4"

# Core library (embeddable sync primitives)
walrust-core = { version = "0.3.0", path = "crates/walrust-core", package = "walrust" }

# Shared S3/retry/upload infrastructure
hadb-io = { path = "../../hadb/hadb-io" }

# S3 client type (shared with hadb-io, needed for function signatures)
aws-sdk-s3 = "1"

# LTX format (Litestream-compatible) - see https://github.com/russellromney/litepages
litepages = "0.1.0"

# SQLite for checkpointing
rusqlite = { version = "0.35", features = ["bundled"] }

# Directory traversal (for shadow WAL size calculation)
walkdir = "2"

# Dashboard + metrics
axum = "0.7"
prometheus = "0.13"

# Compaction
tempfile = "3"

# Memory allocator — returns freed memory to OS (macOS system allocator doesn't)
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
brunch = "0.5"
tower = "0.5"

[[example]]
name = "profile_rss"
path = "bench/profile_rss.rs"

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
