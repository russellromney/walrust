[package]
name = "walrust"
version = "0.7.0"
edition = "2021"
description = "Lightweight SQLite WAL sync to S3/Tigris"
authors = ["Russell Romney <russellromney@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/russellromney/walrust"
homepage = "https://github.com/russellromney/walrust"
keywords = ["sqlite", "wal", "s3", "backup", "sync"]
categories = ["database", "command-line-utilities"]
exclude = [
    "crates/*/target/",
    "bench/",
    "experiments/",
    ".github/",
    "tests/fixtures/format-stability/cli-v0.7.0/",
]

[workspace]
members = [
    ".",
    "crates/walrust-core",
]
resolver = "2"

[lib]
name = "walrust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "walrust"
path = "src/main.rs"
required-features = ["s3"]

[features]
# `s3` (default) enables the S3-compatible convenience constructor and the
# bin/uploader path that ships WAL frames to S3 directly. Without `s3` the
# crate exposes only the no-AWS pieces (errors, ltx, wal, retry) plus the
# walrust-core re-export, and consumers wire in their own
# `hadb_storage::StorageBackend` impl.
default = ["s3"]
s3 = ["dep:aws-sdk-s3", "dep:hadb-storage-s3", "hadb-io/s3", "walrust-core/s3"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Parallelization for native HADBP encoding (CPU-bound compression)
rayon = "1.10"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async trait support
async-trait = "0.1"

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
glob = "0.3"
sha2 = "0.10"

# Webhooks
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
hex = "0.4"

# Core library (embeddable sync primitives)
walrust-core = { version = "0.7.0", path = "crates/walrust-core" }

# Storage substrate (trait is always available; concrete S3 impl is feature-gated).
# hadb-* are crates.io version deps (0.5.0 adds the COMPACTED version-2 changeset
# format used by compaction). For local dev before hadb 0.5.0 is published, a
# gitignored `.cargo/config.toml` `[patch.crates-io]` -> `../hadb` resolves these.
hadb-storage = { version = "0.5.0" }
hadb-storage-s3 = { version = "0.5.0", optional = true }

# Shared config/webhook/retention/S3 helpers. Default-features = false so
# `walrust --no-default-features` can build without aws-sdk; the `s3` feature
# above re-enables hadb-io's `s3` (and pulls in aws-sdk-s3 transitively).
hadb-io = { version = "0.5.0", default-features = false }

# S3 client type (shared with hadb-io, needed for function signatures).
aws-sdk-s3 = { version = "1", optional = true }

# SQLite for checkpointing
rusqlite = { version = "0.35", features = ["bundled", "backup"] }

# Directory traversal (for shadow WAL size calculation)
walkdir = "2"

# Advisory file locking (single-writer guard, E5). Already in the dependency
# graph transitively; declared directly for `libc::flock`.
libc = "0.2"

# Dashboard + metrics
axum = "0.7"
prometheus = "0.13"

# Compaction
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

# Memory allocator — returns freed memory to OS (macOS system allocator doesn't)
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
brunch = "0.5"
tower = "0.5"
# Construct typed AWS SDK errors in unit tests (the not-found classifier in
# `sync::watch_shadow` is typed, not string-matched). Already in the lockfile
# transitively via aws-sdk-s3.
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# macOS link relief for dev/test builds: dsymutil runs per test binary (29 of
# them in this workspace) and full debug info makes that slow. Keeping only
# line-table debuginfo preserves panic/backtrace line numbers while dropping
# the variable/type info dsymutil otherwise has to chew through, and unpacked
# split-debuginfo skips the dsymutil bundling step entirely on macOS.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
