[package]
name = "walrust-dst"
version = "0.1.0"
edition = "2021"
description = "Deterministic Simulation Testing for Walrust"
authors = ["Russell Romney <russellromney@gmail.com>"]
license = "Apache-2.0"

[[bin]]
name = "walrust-dst"
path = "src/main.rs"

[dependencies]
# Walrust (path dependency for testing)
walrust = { path = ".." }

# Storage trait — DST mock + tests implement it directly. crates.io version dep
# (0.5.0); resolves to the same single copy walrust uses. Before hadb 0.5.0 is
# published, the gitignored `.cargo/config.toml` `[patch.crates-io]` resolves it.
hadb-storage = { version = "0.5.0" }

# Property-based testing
proptest = "1.4"

# SQLite for test databases — pinned to walrust's version so only one
# libsqlite3-sys (`links = "sqlite3"`) provider exists in the graph.
rusqlite = { version = "0.35", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Async trait support (must match walrust's version)
async-trait = "0.1"

# Utilities
anyhow = "1"
rand = "0.8"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
