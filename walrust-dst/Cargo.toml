[package]
name = "walrust-dst"
version = "0.1.0"
edition = "2021"
description = "Deterministic Simulation Testing for Walrust"
authors = ["Russell Romney <russellromney@gmail.com>"]
license = "Apache-2.0"

[[bin]]
name = "walrust-dst"
path = "src/main.rs"

[dependencies]
# Walrust (path dependency for testing)
walrust = { path = ".." }

# Storage trait — DST mock + tests implement it directly. Pinned to the same
# hadb commit walrust uses so it resolves to exactly one copy. Rev is on branch
# `feat/changeset-compacted` (Cargo allows only one of branch/rev).
hadb-storage = { git = "https://github.com/russellromney/hadb.git", version = "0.4.0", package = "hadb-storage", rev = "9892610afb6d34441db22618c1918620dded9a03" }

# Property-based testing
proptest = "1.4"

# SQLite for test databases — pinned to walrust's version so only one
# libsqlite3-sys (`links = "sqlite3"`) provider exists in the graph.
rusqlite = { version = "0.35", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Async trait support (must match walrust's version)
async-trait = "0.1"

# Utilities
anyhow = "1"
rand = "0.8"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
