[package]
name = "walrust-dst"
version = "0.1.0"
edition = "2021"
description = "Deterministic Simulation Testing for Walrust"
authors = ["Russell Romney <russellromney@gmail.com>"]
license = "Apache-2.0"

[[bin]]
name = "walrust-dst"
path = "src/main.rs"

[dependencies]
# Walrust (path dependency for testing)
walrust = { path = ".." }

# Storage trait — DST mock + tests implement it directly. Pulled from the same
# git source walrust uses, then redirected to the local path by the [patch]
# below so it resolves to exactly one copy (the same trait version walrust
# links against — no split trait surface, one `links = "sqlite3"` provider).
hadb-storage = { git = "https://github.com/russellromney/hadb.git", version = "0.4.0", package = "hadb-storage", branch = "hoist-prereq-internal-lease-store" }

# Property-based testing
proptest = "1.4"

# SQLite for test databases — pinned to walrust's version so only one
# libsqlite3-sys (`links = "sqlite3"`) provider exists in the graph.
rusqlite = { version = "0.35", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Async trait support (must match walrust's version)
async-trait = "0.1"

# Utilities
anyhow = "1"
rand = "0.8"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

# Redirect the git hadb crates to the local checkout, mirroring walrust's own
# [patch]. This is what aligns the hadb-storage trait + libsqlite3-sys provider
# between this standalone crate and the walrust path dependency it builds on.
[patch."https://github.com/russellromney/hadb.git"]
hadb-changeset = { path = "../../hadb/hadb-changeset" }
hadb-io = { path = "../../hadb/hadb-io" }
hadb-storage = { path = "../../hadb/hadb-storage" }
hadb-storage-s3 = { path = "../../hadb/hadb-storage-s3" }
