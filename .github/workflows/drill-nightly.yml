name: Nightly Drills

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  drill:
    name: nightly drill
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ENDPOINT_URL_S3: http://127.0.0.1:9000
      AWS_REGION: us-east-1
      TIERED_TEST_BUCKET: walrust-nightly
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO failed to become healthy" >&2
          docker logs minio >&2
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 shellcheck

      - name: Create MinIO bucket
        run: |
          python -m pip install --user minio
          python - <<'PY'
          from minio import Minio

          client = Minio(
              "127.0.0.1:9000",
              access_key="minioadmin",
              secret_key="minioadmin",
              secure=False,
          )
          bucket = "walrust-nightly"
          if not client.bucket_exists(bucket):
              client.make_bucket(bucket)
          print(f"Bucket {bucket} ready")
          PY

      - name: Shellcheck drills
        run: shellcheck drills/*.sh

      # Deep state-machine property sweep: the same generated op-sequence +
      # fault-schedule harness the CI tests job runs at 32 cases, explored at
      # 512 cases per phase nightly. A failure shrinks to a minimal sequence,
      # persists it under walrust-dst/proptest-regressions/, and turns this
      # workflow red.
      - name: State-machine property sweep (deep)
        run: PROPTEST_CASES=512 cargo test -p walrust-dst state_machine

      - name: Drill
        id: drill
        continue-on-error: true
        run: |
          set -o pipefail
          make drill USE_SOUP=0 2>&1 | tee drill.log

      - name: Open or update failure issue
        if: steps.drill.outcome == 'failure'
        run: |
          failed_drill=$(awk '/DRILL_FAILED:/ { print $2; exit }' drill.log)
          failed_drill=${failed_drill:-make drill}
          title="Nightly drill failed: ${failed_drill}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(mktemp)
          {
            printf 'Nightly drill failure: `%s`\n\n' "$failed_drill"
            printf 'Run: %s\n\n' "$run_url"
            printf 'Recent log:\n\n```text\n'
            tail -n 120 drill.log
            printf '\n```\n'
          } >"$body"

          existing=$(
            TITLE="$title" gh issue list \
              --state open \
              --search "$title in:title" \
              --json number,title \
              --jq '.[] | select(.title == env.TITLE) | .number' |
            head -n 1
          )

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body"
          fi

          exit 1

      - name: sccache stats
        if: always()
        run: sccache --show-stats
