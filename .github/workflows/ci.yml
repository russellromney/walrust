name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on PR branches; never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # sccache: compilation cache backed by the GitHub Actions cache.
  # CARGO_INCREMENTAL=0 pairs with it (sccache does not cache incremental builds).
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  # fmt + clippy run in parallel with the test job instead of serializing
  # ahead of it.
  lint:
    name: fmt, clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  test:
    name: tests
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ENDPOINT_URL_S3: http://127.0.0.1:9000
      AWS_REGION: us-east-1
      TIERED_TEST_BUCKET: walrust-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Service containers can't be given a command, and minio/minio requires
      # `server /data`, so start it with docker run instead.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO failed to become healthy" >&2
          docker logs minio >&2
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Faster linker for the many test binaries (sccache cannot cache links).
      - name: Setup mold
        uses: rui314/setup-mold@v1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Install Litestream
        run: |
          curl -fsSL -o litestream.tar.gz \
            https://github.com/benbjohnson/litestream/releases/download/v0.5.14/litestream-0.5.14-linux-x86_64.tar.gz
          tar -xzf litestream.tar.gz
          sudo mv litestream /usr/local/bin/
          litestream version

      - name: Create MinIO bucket
        run: |
          python -m pip install --user minio
          python - <<'PY'
          from minio import Minio

          client = Minio(
              "127.0.0.1:9000",
              access_key="minioadmin",
              secret_key="minioadmin",
              secure=False,
          )
          bucket = "walrust-ci"
          if not client.bucket_exists(bucket):
              client.make_bucket(bucket)
          print(f"Bucket {bucket} ready")
          PY

      - name: Test
        run: make test USE_SOUP=0

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  basic_e2e:
    name: basic_e2e
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ENDPOINT_URL_S3: http://127.0.0.1:9000
      AWS_REGION: us-east-1
      TIERED_TEST_BUCKET: walrust-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO failed to become healthy" >&2
          docker logs minio >&2
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 shellcheck

      - name: Create MinIO bucket
        run: |
          python -m pip install --user minio
          python - <<'PY'
          from minio import Minio

          client = Minio(
              "127.0.0.1:9000",
              access_key="minioadmin",
              secret_key="minioadmin",
              secure=False,
          )
          bucket = "walrust-ci"
          if not client.bucket_exists(bucket):
              client.make_bucket(bucket)
          print(f"Bucket {bucket} ready")
          PY

      - name: Shellcheck drills
        # SC2119 (info) fires on every argless call of a function with optional
        # args — lib.sh helpers intentionally default to $DRILL_DB when called
        # bare, so this code is excluded rather than annotating every call site.
        run: shellcheck -e SC2119 drills/*.sh

      - name: basic_e2e
        run: make basic-e2e USE_SOUP=0

      - name: sccache stats
        if: always()
        run: sccache --show-stats
