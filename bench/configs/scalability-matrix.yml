name: "scalability-matrix"

# Matrix configuration - will expand to all combinations
matrix:
  databases: [1, 5, 10, 20]
  writes_per_second: [10, 50, 100]
  duration_seconds: [30]
  tools: [walrust, litestream]

# Default values (overridden by matrix)
workload:
  type: "rate-limited"
  writes_per_second: 10
  duration_seconds: 30

databases:
  count: 1
  size_kb: 100

storage:
  bucket: "s3://walrust-bench"
  endpoint: "https://fly.storage.tigris.dev"

metrics:
  resource_sample_interval_ms: 100

# This expands to: 4 × 3 × 1 × 2 = 24 benchmark runs
# Example combinations:
#   - 1 DB @ 10 w/s for 30s (walrust)
#   - 1 DB @ 10 w/s for 30s (litestream)
#   - 1 DB @ 50 w/s for 30s (walrust)
#   - 1 DB @ 50 w/s for 30s (litestream)
#   - ... (20 more combinations)
